name: Econ Vitals Japan fetch

# Downloads the raw files for the Econ Vitals Japan dashboard from the official
# sources and commits them to data/. The Claude scheduled task (Saturdays 11:23 JST)
# pulls this repo, builds the datasets and publishes them to the dashboard.

on:
  schedule:
    - cron: '7 1 * * 6'        # Saturdays 10:07 JST (01:07 UTC)
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ['fetcher/**', '.github/workflows/**']   # test run whenever the downloader changes

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download from the official sources
        id: fetch
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          rm -rf run raw-new
          python3 fetcher/manifest.py run "$TODAY" > /dev/null
          set +e
          python3 fetcher/fetch.py run/plan.json raw-new > fetch-report.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          cat fetch-report.json

      - name: Convert spreadsheets (.xls to JSON)
        run: |
          pip install --quiet xlrd==2.0.1
          python3 fetcher/convert.py raw-new

      - name: Save the files and a status note
        id: save
        run: |
          python3 - "${{ steps.fetch.outputs.today }}" <<'PY'
          # A source that returned nothing keeps last week's files (marked stale) so one
          # outage doesn't freeze the whole dashboard. Data is replaced only if every
          # source is either fresh or has a previous copy to fall back on.
          import hashlib, json, os, shutil, sys, datetime
          today = sys.argv[1]
          report = json.load(open('fetch-report.json'))
          stale = sorted(s for s, v in report.items() if v['ok'] == 0)
          ok = True
          for s in stale:
              if os.path.isdir(os.path.join('data', s)):
                  shutil.rmtree(os.path.join('raw-new', s), ignore_errors=True)
                  shutil.copytree(os.path.join('data', s), os.path.join('raw-new', s))
              else:
                  ok = False
          if ok:
              shutil.rmtree('data', ignore_errors=True); shutil.move('raw-new', 'data')
          sha = {f: hashlib.sha256(open('fetcher/' + f, 'rb').read()).hexdigest() for f in ('manifest.py', 'fetch.py')}
          json.dump({'run_date_jst': today, 'finished_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                     'ok': ok, 'data_replaced': ok, 'stale_sources': stale, 'report': report, 'code_sha256': sha},
                    open('status.json', 'w'), indent=1)
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f"ok={'true' if ok else 'false'}\nstale={' '.join(stale)}\n")
          PY
          cat status.json

      - name: Commit
        run: |
          git config user.name 'econ-vitals-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A .
          git commit -m "Fetch $(TZ=Asia/Tokyo date +%F): ok=$(python3 -c "import json;print(json.load(open('status.json'))['ok'])")" || echo 'nothing to commit'
          git push

      - name: Flag stale or failed sources
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "::warning::Sources that returned nothing this run (last week's files kept): ${{ steps.save.outputs.stale }}"
          if [ "${{ steps.save.outputs.ok }}" != "true" ]; then echo 'A source failed and had no earlier copy; data not replaced.'; exit 1; fi
